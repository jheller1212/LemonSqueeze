name: CI

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # every script the page or the functions load must at least parse
      - run: for f in web/*.js web/lib/*.js netlify/functions/*.mjs tests/web/*.mjs tests/web/ui/*.mjs; do node --check "$f" || exit 1; done
      # pure logic (filters, sampling, controls, CSV streaming, ...) is unit-tested
      - run: node --test "tests/web/unit/*.test.mjs"
